openapi: 3.1.0
info:
  title: Overcall API
  version: local
paths:
  /healthz:
    get:
      summary: Health
      operationId: health_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Healthz Get
  /readyz:
    get:
      summary: Readiness
      operationId: readiness_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Readiness Readyz Get
  /v1/me:
    get:
      tags:
      - account
      summary: Get Me
      operationId: get_me_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /v1/overview:
    get:
      tags:
      - overview
      summary: Get Overview
      operationId: get_overview_v1_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
  /v1/issues:
    get:
      tags:
      - issues
      summary: List Issues
      operationId: list_issues_v1_issues_get
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - openai
            - stripe
            - aws
            type: string
          - type: 'null'
          title: Provider
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - critical
            - warning
            - info
            type: string
          - type: 'null'
          title: Severity
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - 1
            - 2
            - 3
            type: integer
          - type: 'null'
          title: Tier
      - name: impact_kind
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - spend
            - reliability
            type: string
          - type: 'null'
          title: Impact Kind
      - name: include_experimental
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Experimental
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Issue_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/issues/{issue_id}:
    get:
      tags:
      - issues
      summary: Get Issue
      operationId: get_issue_v1_issues__issue_id__get
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/logs:
    get:
      tags:
      - logs
      summary: List Logs
      operationId: list_logs_v1_logs_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Q
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - openai
            - stripe
            - aws
            type: string
          - type: 'null'
          title: Provider
      - name: status_class
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - 2xx
            - 3xx
            - 4xx
            - 5xx
            type: string
          - type: 'null'
          title: Status Class
      - name: endpoint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Endpoint
      - name: caller
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Caller
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Model
      - name: issue_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Issue Id
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_LogEntry_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/logs/facets:
    get:
      tags:
      - logs
      summary: Log Facets
      operationId: log_facets_v1_logs_facets_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogFacets'
  /v1/logs/{log_id}:
    get:
      tags:
      - logs
      summary: Get Log
      operationId: get_log_v1_logs__log_id__get
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Log Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/providers:
    get:
      tags:
      - providers
      summary: List Providers
      operationId: list_providers_v1_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Provider'
                type: array
                title: Response List Providers V1 Providers Get
  /v1/settings:
    get:
      tags:
      - settings
      summary: Get Settings
      operationId: get_settings_v1_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
    put:
      tags:
      - settings
      summary: Put Settings
      operationId: put_settings_v1_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/reset:
    post:
      tags:
      - settings
      summary: Reset Settings
      operationId: reset_settings_v1_settings_reset_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules:
    get:
      tags:
      - rules
      summary: List Rules
      operationId: list_rules_v1_rules_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RuleInfo'
                type: array
                title: Response List Rules V1 Rules Get
  /v1/detection/run:
    post:
      tags:
      - detection
      summary: Start Run
      operationId: start_run_v1_detection_run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
  /v1/detection/runs/latest:
    get:
      tags:
      - detection
      summary: Latest Run
      operationId: latest_run_v1_detection_runs_latest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummary'
  /v1/demo/load:
    post:
      tags:
      - demo
      summary: Load Demo
      operationId: load_demo_v1_demo_load_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoadIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoLoadOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/demo:
    delete:
      tags:
      - demo
      summary: Delete Demo
      operationId: delete_demo_v1_demo_delete
      responses:
        '204':
          description: Successful Response
  /v1/data:
    delete:
      tags:
      - data
      summary: Delete All Data
      operationId: delete_all_data_v1_data_delete
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - additionalProperties: true
                type: object
              - type: 'null'
              title: Body
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/accuracy:
    get:
      tags:
      - accuracy
      summary: Get Accuracy
      operationId: get_accuracy_v1_accuracy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accuracy'
components:
  schemas:
    Accuracy:
      properties:
        datasets:
          items:
            $ref: '#/components/schemas/AccuracyDataset'
          type: array
          title: Datasets
      additionalProperties: false
      type: object
      required:
      - datasets
      title: Accuracy
    AccuracyDataset:
      properties:
        id:
          type: string
          enum:
          - synthetic
          - real
          title: Id
        label:
          type: string
          title: Label
        note:
          type: string
          title: Note
        generated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Generated At
        requests:
          type: integer
          title: Requests
        rules:
          items:
            $ref: '#/components/schemas/AccuracyRule'
          type: array
          title: Rules
      additionalProperties: false
      type: object
      required:
      - id
      - label
      - note
      - generated_at
      - requests
      - rules
      title: AccuracyDataset
    AccuracyRule:
      properties:
        rule_id:
          type: string
          title: Rule Id
        tier:
          type: integer
          title: Tier
        positives:
          type: integer
          title: Positives
        flagged:
          type: integer
          title: Flagged
        true_positives:
          type: integer
          title: True Positives
        precision:
          anyOf:
          - type: number
          - type: 'null'
          title: Precision
        recall:
          anyOf:
          - type: number
          - type: 'null'
          title: Recall
        false_positives_on_hard_negatives:
          anyOf:
          - type: integer
          - type: 'null'
          title: False Positives On Hard Negatives
        wilson_low:
          anyOf:
          - type: number
          - type: 'null'
          title: Wilson Low
        wilson_high:
          anyOf:
          - type: number
          - type: 'null'
          title: Wilson High
      additionalProperties: false
      type: object
      required:
      - rule_id
      - tier
      - positives
      - flagged
      - true_positives
      - precision
      - recall
      title: AccuracyRule
    DemoLoadIn:
      properties:
        seed:
          type: integer
          maximum: 2147483647.0
          minimum: 0.0
          title: Seed
          default: 42
        days:
          type: integer
          maximum: 30.0
          minimum: 1.0
          title: Days
          default: 7
      additionalProperties: false
      type: object
      title: DemoLoadIn
    DemoLoadOut:
      properties:
        inserted:
          type: integer
          title: Inserted
      additionalProperties: false
      type: object
      required:
      - inserted
      title: DemoLoadOut
    ExperimentalSavings:
      properties:
        projected_monthly_usd:
          type: number
          title: Projected Monthly Usd
      additionalProperties: false
      type: object
      required:
      - projected_monthly_usd
      title: ExperimentalSavings
    FacetValue:
      properties:
        value:
          type: string
          title: Value
        count:
          type: integer
          title: Count
      additionalProperties: false
      type: object
      required:
      - value
      - count
      title: FacetValue
    FlaggedBy:
      properties:
        issue_id:
          type: string
          format: uuid
          title: Issue Id
        rule_id:
          type: string
          title: Rule Id
        title:
          type: string
          title: Title
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
          title: Severity
      additionalProperties: false
