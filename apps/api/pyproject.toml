[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "overcall-api"
version = "0.1.0"
description = "Overcall API and metadata-only proxy"
requires-python = ">=3.11"
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "sqlmodel==0.0.24",
  "uvicorn[standard]==0.34.0",
]

[tool.setuptools.packages.find]
include = ["overcall*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
