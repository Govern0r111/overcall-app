name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "contract/**"
      - "supabase/migrations/**"
      - "docker-compose.dev.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "contract/**"
      - "supabase/migrations/**"
      - "docker-compose.dev.yml"
      - ".github/workflows/ci.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: overcall
          POSTGRES_USER: overcall
          POSTGRES_PASSWORD: overcall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U overcall -d overcall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql://overcall:overcall@localhost:5432/overcall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/init_test_db.py
      - run: ruff check overcall/config.py overcall/deps.py overcall/errors.py overcall/logging.py overcall/main.py overcall/models.py overcall/db overcall/pricing overcall/pricing_config.py overcall/detection overcall/api overcall/mock_openai overcall/proxy overcall/auth overcall/synthetic tests/conftest.py tests/unit tests/integration tests/security scripts
      - run: python scripts/check_legacy_dependencies.py
      - run: python scripts/check_pricing_age.py
      - run: python scripts/check_contract.py
      - run: pytest
